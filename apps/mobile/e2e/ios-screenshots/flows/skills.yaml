appId: com.matebot.app
name: Skills
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MATEBOT_ACTIVE_EMAIL: ${MATEBOT_SCREENSHOT_EMAIL}
- openLink: "matebot:///skills"
- extendedWaitUntil:
    visible: ".*Review Kit.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-skills
- tapOn: "Matebot"
- extendedWaitUntil:
    visible: ".*name: Matebot.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-skill
- tapOn: "Back"
- tapOn: ".*New skill.*"
- extendedWaitUntil:
    visible: "Save"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-skill
- openLink: "matebot:///skills"
- tapOn: ".*Review Kit.*"
- extendedWaitUntil:
    visible: ".*Install.*|.*Add.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-plugin
