appId: com.matebot.app
name: Billing
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "matebot:///billing"
- extendedWaitUntil:
    visible: ".*Renews.*|.*Plan.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-billing
- tapOn: "Standard"
- extendedWaitUntil:
    visible: "Max · .*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-billing-tiers
- openLink: "matebot:///wallet"
- extendedWaitUntil:
    visible: "Disconnect"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-wallet
