appId: com.matebot.app
name: Messaging
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MATEBOT_ACTIVE_EMAIL: ${MATEBOT_SCREENSHOT_EMAIL}
- openLink: "matebot:///messaging"
- extendedWaitUntil:
    visible: ".*#launch.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-messaging
- tapOn: ".*#launch.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-team-conversation
