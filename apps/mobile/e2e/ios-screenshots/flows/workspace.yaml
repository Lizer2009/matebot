appId: com.matebot.app
name: Workspace
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "matebot:///board"
- extendedWaitUntil:
    visible: ".*Draft the launch announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-board
- openLink: "matebot:///approvals"
- extendedWaitUntil:
    visible: ".*example.com.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-approval-rules
- openLink: "matebot:///vault"
- extendedWaitUntil:
    visible: ".*deploy_token.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-vault
- tapOn: "Help desk"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-vault-item
- tapOn: "Remove"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-vault-remove
- tapOn: "Cancel"
- tapOn: "Done"
- tapOn: "New item"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-vault-new
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-vault-new-card
- tapOn: "Cancel"
- openLink: "matebot:///archived-bots"
- extendedWaitUntil:
    visible: ".*Archived fixture.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-archived-bots
- openLink: "matebot:///space?spaceId=${RAKAZO_SCREENSHOT_TEAM_SPACE_ID}"
- extendedWaitUntil:
    visible: ".*Customize.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-space-settings
