appId: com.matebot.app
name: Bots
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MATEBOT_ACTIVE_EMAIL: ${MATEBOT_SCREENSHOT_EMAIL}
- openLink: "matebot:///bot-profile?botId=${MATEBOT_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Routines.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bot-profile
- tapOn: ".*Routines.*"
- extendedWaitUntil:
    visible: ".*Weekly fixture review.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-routines
- openLink: "matebot:///bot-model?botId=${MATEBOT_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*Space default.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-bot-model
- openLink: "matebot:///peer-chat?botId=${MATEBOT_SCREENSHOT_BOT_ID}&botName=Researcher&peerBotId=${MATEBOT_SCREENSHOT_PEER_BOT_ID}&peerBotName=Writer"
- extendedWaitUntil:
    visible: ".*draft the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-peer-chat
